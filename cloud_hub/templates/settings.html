<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações | Dark Factory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #020617;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-item {
            transition: all 0.2s ease;
        }
        .nav-item:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }
        .input-dark {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .input-dark:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-slate-950 border-r border-white/5 p-6 flex flex-col">
        <div class="flex items-center space-x-3 mb-10">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                <span class="font-bold text-white">D</span>
            </div>
            <h2 class="text-xl font-bold tracking-tight">Dark Factory</h2>
        </div>

        <nav class="flex-1 space-y-2">
            <a href="/" class="nav-item flex items-center space-x-3 p-3 rounded-xl text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="/channels" class="nav-item flex items-center space-x-3 p-3 rounded-xl text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                <span>Canais</span>
            </a>
            <a href="/settings" class="nav-item flex items-center space-x-3 p-3 rounded-xl bg-blue-600/10 text-blue-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span>Configurações</span>
            </a>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/5">
            <a href="/logout" class="flex items-center space-x-3 p-3 text-red-400 hover:bg-red-400/10 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                <span>Sair</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-12 overflow-y-auto">
        <div class="max-w-4xl mx-auto">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-10">
                <div>
                    <h1 class="text-3xl font-bold text-white mb-2">Configurações de API</h1>
                    <p class="text-gray-400">Gerencie suas chaves pessoais para os motores de IA e mídia.</p>
                </div>
                <div class="mt-4 md:mt-0">
                    <span class="px-4 py-2 bg-blue-600/20 text-blue-400 rounded-full text-sm font-semibold border border-blue-600/30">
                        {{ tenant.plan_type | upper }} PLAN
                    </span>
                </div>
            </div>

            <form action="/settings" method="POST" class="space-y-8">
                <!-- AI Engines -->
                <section class="glass-card rounded-3xl p-8">
                    <h3 class="text-xl font-semibold mb-6 flex items-center">
                        <span class="w-8 h-8 bg-purple-600/20 text-purple-400 rounded-lg flex items-center justify-center mr-3">🧠</span>
                        Motores de Inteligência Artificial
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Google Gemini API Key</label>
                            <input type="password" name="gemini" value="{{ tenant.personal_api_keys.gemini }}" 
                                   class="w-full input-dark rounded-xl px-4 py-3 text-sm" placeholder="AIzaSy...">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">OpenAI API Key</label>
                            <input type="password" name="openai" value="{{ tenant.personal_api_keys.openai }}" 
                                   class="w-full input-dark rounded-xl px-4 py-3 text-sm" placeholder="sk-...">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">DeepSeek API Key</label>
                            <input type="password" name="deepseek" value="{{ tenant.personal_api_keys.deepseek }}" 
                                   class="w-full input-dark rounded-xl px-4 py-3 text-sm" placeholder="sk-...">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Anthropic API Key</label>
                            <input type="password" name="anthropic" value="{{ tenant.personal_api_keys.anthropic }}" 
                                   class="w-full input-dark rounded-xl px-4 py-3 text-sm" placeholder="sk-ant-...">
                        </div>
                    </div>
                </section>

                <!-- Media Assets -->
                <section class="glass-card rounded-3xl p-8">
                    <h3 class="text-xl font-semibold mb-6 flex items-center">
                        <span class="w-8 h-8 bg-green-600/20 text-green-400 rounded-lg flex items-center justify-center mr-3">🎬</span>
                        Bancos de Mídia (B-Roll)
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Pexels API Key</label>
                            <input type="password" name="pexels" value="{{ tenant.personal_api_keys.pexels }}" 
                                   class="w-full input-dark rounded-xl px-4 py-3 text-sm" placeholder="Chave Pexels...">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Pixabay API Key</label>
                            <input type="password" name="pixabay" value="{{ tenant.personal_api_keys.pixabay }}" 
                                   class="w-full input-dark rounded-xl px-4 py-3 text-sm" placeholder="Chave Pixabay...">
                        </div>
                    </div>
                </section>

                <div class="flex items-center justify-end space-x-4">
                    <button type="reset" class="px-6 py-3 text-gray-400 hover:text-white transition-all">Descartar</button>
                    <button type="submit" class="px-10 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold shadow-lg shadow-blue-600/20 transition-all transform hover:-translate-y-1">
                        Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
