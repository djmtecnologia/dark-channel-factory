<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dark Channel Factory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #000);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .gradient-text {
            background: linear-gradient(135deg, #60a5fa, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-glass:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.3);
            outline: none;
        }

        .btn-premium {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-premium::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            transform: scale(0);
            transition: transform 0.6s ease-out;
        }

        .btn-premium:hover::after {
            transform: scale(1);
        }
    </style>
</head>
<body>
    <div class="absolute inset-0 z-0">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <div class="relative z-10 w-full max-w-md p-4">
        <div class="glass rounded-3xl p-8 md:p-12">
            <div class="text-center mb-10">
                <div class="inline-block p-4 rounded-2xl bg-blue-500/10 mb-6 animate-float">
                    <svg class="w-12 h-12 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold text-white mb-2 tracking-tight">Dark Factory <span class="gradient-text">Cloud</span></h1>
                <p class="text-gray-400 text-sm">Entre para gerenciar sua fábrica autônoma</p>
            </div>

            <form action="/login" method="POST" class="space-y-6">
                <div>
                    <label class="block text-gray-300 text-xs font-semibold uppercase tracking-wider mb-2 ml-1">E-mail</label>
                    <input type="email" name="username" required 
                           class="w-full input-glass rounded-xl px-5 py-4 text-white placeholder-gray-500" 
                           placeholder="seu@email.com">
                </div>
                
                <div>
                    <div class="flex justify-between items-center mb-2 ml-1">
                        <label class="block text-gray-300 text-xs font-semibold uppercase tracking-wider">Senha</label>
                        <a href="#" class="text-xs text-blue-400 hover:text-blue-300 transition-colors">Esqueceu?</a>
                    </div>
                    <input type="password" name="password" required 
                           class="w-full input-glass rounded-xl px-5 py-4 text-white placeholder-gray-500" 
                           placeholder="••••••••">
                </div>

                <div class="flex items-center ml-1">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-gray-800 border-gray-700 text-blue-600 focus:ring-blue-500">
                    <label for="remember" class="ml-2 text-sm text-gray-400">Lembrar de mim</label>
                </div>

                <button type="submit" class="w-full btn-premium py-4 rounded-xl text-white font-bold text-lg shadow-lg">
                    Acessar Dashboard
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-white/5 text-center">
                <p class="text-gray-500 text-sm">Não tem uma conta? 
                    <a href="#" class="text-blue-400 font-semibold hover:underline">Fale com suporte</a>
                </p>
            </div>
        </div>
        
        <p class="text-center mt-8 text-gray-600 text-xs tracking-widest uppercase">
            &copy; 2026 Antigravity Labs • Premium Industrial AI
        </p>
    </div>
</body>
</html>
